[package]
name = "bench-hashes"
version = "0.5.0+7b47c3b7a25176eb5c7678ad8aac56c72ee7556f"
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[dependencies]
# Rayon is not enabled, so BLAKE3 remains single-threaded.
[dependencies.blake3]
version = "1"
default-features = false
features = ["std"]

# Machine metadata does not need sysinfo's multithread feature.
[dependencies.sysinfo]
version = "0.30"
default-features = false

# Assembly backends where sha2-asm / keccak-asm support the target.
# sha2-asm 0.6.4 compile_error!s on all Windows targets; on x86-64 the
# SHA-256 hot path is SHA-NI regardless.
[target.'cfg(not(windows))'.dependencies.sha2]
version = "0.10"
features = ["asm", "asm-aarch64"]

[target.'cfg(windows)'.dependencies]
sha2 = { version = "0.10" }

# BLAKE3 with the SME2 kernels (Apple M4 and later), from the sme2-bench
# branch of the fork. Same single-threaded blake3::hash API; the crate
# requires SME2 at build time and run time and fails stop otherwise.
# Cargo.lock pins the exact commit; `cargo update -p blake3_sme2` moves to
# the branch tip.
[dependencies.blake3_sme2]
git = "https://github.com/johnservil/BLAKE3"
branch = "sme2-bench"
default-features = false
features = ["std"]

# SHA-1 with collision detection (the SHA-1DC construction git uses), pure
# Rust; there is no hardware path for the detection.
[dependencies.sha1-checked]
version = "0.10"

[build-dependencies]
# Used to fingerprint a dirty benchmark working tree.
[build-dependencies.blake3]
version = "1"
default-features = false
features = ["std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
