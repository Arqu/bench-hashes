[package]
name = "bench-hashes"
version = "0.5.0+7b47c3b7a25176eb5c7678ad8aac56c72ee7556f"
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[dependencies]
# Rayon is not enabled, so BLAKE3 remains single-threaded.
[dependencies.blake3]
version = "1"
default-features = false
features = ["std"]

# Machine metadata does not need sysinfo's multithread feature.
[dependencies.sysinfo]
version = "0.30"
default-features = false

# sha2 0.11 carries its own hardware backends (ARMv8 SHA-256 instructions,
# x86 SHA-NI) with runtime detection, on every target.
[dependencies.sha2]
version = "0.11"
default-features = false

# SHA-256 through BoringSSL's assembly (OpenSSL lineage), which pipelines
# the next block's message schedule under the current block's rounds.
[dependencies.ring]
version = "0.17"
default-features = false

# BLAKE3 with the SME2 kernels (Apple M4 and later), from the local
# checkout of the fork's sme2-bench branch (sibling directory ../BLAKE3).
# Same single-threaded blake3::hash API; the crate requires SME2 at build
# time and run time and fails stop otherwise. Edits to ../BLAKE3 take
# effect on the next build.
[dependencies.blake3_sme2]
path = "../BLAKE3"
default-features = false
features = ["std"]

# SHA-1 with collision detection (the SHA-1DC construction git uses), pure
# Rust; there is no hardware path for the detection.
[dependencies.sha1-checked]
version = "0.10"

[build-dependencies]
# Used to fingerprint a dirty benchmark working tree.
[build-dependencies.blake3]
version = "1"
default-features = false
features = ["std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
