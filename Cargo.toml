[package]
name = "bench-hashes"
version = "0.6.0+4693c2fe4a275c15421e987cd95ee1d0331a7b8d"
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[dependencies]
# The `rayon` feature adds Hasher::update_rayon for the BLAKE3 mt contender;
# blake3::hash and every other API stay single-threaded with it on.
[dependencies.blake3]
version = "1"
default-features = false
features = ["std", "rayon"]

# Machine metadata does not need sysinfo's multithread feature.
[dependencies.sysinfo]
version = "0.30"
default-features = false

# sha2 0.11 carries its own hardware backends (ARMv8 SHA-256 instructions,
# x86 SHA-NI) with runtime detection, on every target.
[dependencies.sha2]
version = "0.11"
default-features = false

# SHA-256 through BoringSSL's assembly (OpenSSL lineage), which pipelines
# the next block's message schedule under the current block's rounds.
[dependencies.ring]
version = "0.17"
default-features = false

# BLAKE3 with the SME2 kernels (Apple M4 and later), from the enclosing
# checkout of the fork's sme2-bench branch (this repository lives inside
# it). Edits there take effect on the next build.
[dependencies.blake3-servil]
path = ".."
default-features = false
features = ["std"]

# SHA-1 with collision detection (the SHA-1DC construction git uses), pure
# Rust; there is no hardware path for the detection.
[dependencies.sha1-checked]
version = "0.10"

[build-dependencies]
# Used to fingerprint a dirty benchmark working tree.
[build-dependencies.blake3]
version = "1"
default-features = false
features = ["std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
